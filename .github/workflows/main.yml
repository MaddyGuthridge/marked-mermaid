name: "CI"
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  Test:
    strategy:
      matrix:
        marked-version: ['marked@16', 'marked@17', 'marked@18']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@${{ steps.nvm.outputs.NODE_VERSION }}
          cache: true
      - name: Install Dependencies
        run: pnpm ci
      - name: Test with marked version
        run: pnpm i -D ${{ matrix.marked-version }}
      - name: Run Tests 👩🏽‍💻
        run: pnpm test

  Types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@${{ steps.nvm.outputs.NODE_VERSION }}
          cache: true
      - name: Install Dependencies
        run: pnpm ci
      - name: Run Tests 👩🏽‍💻
        run: pnpm run test:types

  Coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@${{ steps.nvm.outputs.NODE_VERSION }}
          cache: true
      - name: Install Dependencies
        run: pnpm ci
      - name: Run Tests 👩🏽‍💻
        run: pnpm test:cover

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@${{ steps.nvm.outputs.NODE_VERSION }}
          cache: true
      - name: Install Dependencies
        run: pnpm ci
      - name: Lint ✨
        run: pnpm lint

  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
      - run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvm
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@${{ steps.nvm.outputs.NODE_VERSION }}
          cache: true
      - name: Install Dependencies
        run: pnpm ci
      - name: Build 🗜️
        run: pnpm run build
